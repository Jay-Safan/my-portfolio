<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0e1118" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <link rel="preload" as="image" href="/portrait.jpg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === null) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Muhammad Jay Safan — Fullstack & Mobile Developer</title>
    <meta name="description" content="Fullstack and mobile developer open to fulltime, remote, and freelance roles. Experienced with React, Laravel, Flutter, and more." />
    <meta name="author" content="Muhammad Jay Safan" />
    <meta name="keywords" content="fullstack developer, mobile developer, React, Laravel, Flutter, React Native, PHP, freelance, remote" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhammad Jay Safan — Fullstack & Mobile Developer" />
    <meta property="og:description" content="Fullstack and mobile developer open to fulltime, remote, and freelance roles. Experienced with React, Laravel, Flutter, and more." />
    <meta property="og:url" content="https://jaysafan.dev" />
    <meta property="og:image" content="https://jaysafan.dev/portrait.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://jaysafan.dev" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://jaysafan.dev/portrait.jpg" />

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
